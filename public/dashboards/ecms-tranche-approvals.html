   '<div class="ctrl"><label>font <input type="range" min="12" max="23" value="15" data-c="cardG"></label>'+
   '<button class="btn" data-png="cardG" data-n="geography">\u2193 Export PNG</button></div>'+
   '<div class="card summary" id="cardG">'+
     '<div class="khead"><div><div class="ctitle">ECMS projects by state, where disclosed</div>'+
       '<div class="ccap">MeitY publishes plant locations for only some ECMS projects. These are the '+loc+' with a confirmed site; the other ~'+(SUM.proj-loc)+' of 106 projects have no location disclosed at the project level, so this is a partial map, not the full geography.</div></div>'+
       '<div class="date">7 STATES SHOWN</div></div>'+
     '<div class="leg" style="margin-top:14px"><span><i class="sw" style="background:var(--cyan)"></i>Bare components</span>'+
       '<span><i class="sw" style="background:var(--mag)"></i>Sub-assemblies</span>'+
       '<span><i class="sw" style="background:var(--yel)"></i>Materials &amp; supply chain</span>'+
       '<span><i class="sw" style="background:var(--cap)"></i>Capital goods</span></div>'+
     '<div class="geogrid">'+blocks+'</div>'+
     '<div class="sub2" style="margin:14px 0 0;color:#8a8a8a;font-weight:400">City shown where given. \u2020 location from press reporting; the rest are from MeitY\'s operational-facility briefing. Tamil Nadu, Karnataka and Maharashtra also lead on project counts across the tranches.</div>'+
     '<div class="src"><span>plant locations · MeitY facility briefing + press reports</span><span class="brand">@indiaemerges</span></div>'+
   '</div></div>';
}
function summaryCard(){
  var kpi=function(v,l,t){return '<div class="kpi"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+(t?'<div class="t">'+t+'</div>':'')+'</div>';};
  var MAXT=Math.max.apply(null,T.map(function(t){return t.inv;}));
  var tbars=T.map(function(t){
    var short=t.d.split(" ").slice(1).join(" ");
    return '<div class="tgroup"><div class="tlabel"><span class="tn">T'+t.n+' · '+short+'</span>'+
      '<span class="tamt">₹'+t.inv.toLocaleString("en-IN")+' cr · '+t.proj+' projects</span></div>'+
      '<div class="tbar"><i style="width:'+(t.inv/TOTINV*100).toFixed(1)+'%"></i></div></div>';}).join("");
  var earlier=SUM.proj-SUMX.operational-SUMX.advanced;
  var impl='<div class="implbar">'+
    '<div style="width:'+(SUMX.operational/SUM.proj*100)+'%;background:#e6e6e6">'+SUMX.operational+'</div>'+
    '<div style="width:'+(SUMX.advanced/SUM.proj*100)+'%;background:#8a8a8a">'+SUMX.advanced+'</div>'+
    '<div style="width:'+(earlier/SUM.proj*100)+'%;background:#333;color:#cfcfcf">'+earlier+'</div></div>'+
    '<div class="impleg"><span><i class="sw" style="background:#e6e6e6"></i>Operational ('+SUMX.operational+')</span>'+
      '<span><i class="sw" style="background:#8a8a8a"></i>Advanced construction ('+SUMX.advanced+')</span>'+
      '<span><i class="sw" style="background:#333"></i>Earlier stages ('+earlier+', incl. 31 just approved)</span></div>';
  var pills='<div class="pills">'+COVER.map(function(c){
    return '<div class="pill">'+c[0]+' <b>'+c[1]+'%</b></div>';}).join("")+'</div>';
  var layer=(function(){var t=LAYER.reduce(function(a,x){return a+x[1];},0);return '<div class="implbar">'+LAYER.map(function(x){return '<div style="width:'+(x[1]/t*100)+'%;background:'+COL[x[2]]+'">'+x[1]+'</div>';}).join('')+'</div>';})();
  var demand=(function(){return DEMAND.map(function(d){return '<div class="secrow"><div class="scn"><i class="sw" style="background:'+COL[d[2]]+'"></i><span>'+d[0]+'</span></div><div class="scb"><i style="width:'+d[1]+'%;background:'+COL[d[2]]+'"></i></div><div class="dtag">'+d[3]+'</div></div>';}).join('');})();
  var states='<div class="pills">'+STATES.map(function(s){
    return '<div class="pill">'+s+'</div>';}).join("")+'<div class="pill" style="color:#7f7f7f">+1 state (tranche 4, not named in release)</div></div>';
  return '<div class="unit">'+
   '<div class="ctrl"><label>font <input type="range" min="12" max="23" value="15" data-c="cardS"></label>'+
   '<button class="btn" data-png="cardS" data-n="summary">↓ Export PNG</button></div>'+
   '<div class="card summary" id="cardS">'+
     '<div class="khead"><div><div class="ctitle">ECMS at a glance: five tranches</div>'+
       '<div class="ccap">Cumulative approvals under the Electronics Component Manufacturing Scheme, Oct 2025 to Aug 2026. Investment and projected output have already overshot the scheme\'s original targets; the jobs target is 82% met.</div></div>'+
       '<div class="date">AS OF 17 AUG 2026</div></div>'+
     '<div class="kpis">'+
       kpi(SUM.proj,"PROJECTS","across "+SUM.products+" products · "+SUM.states+" states")+
       kpi("₹"+(SUM.inv/1000).toFixed(1)+"k cr","INVESTMENT","117% of ₹"+(SUM.invT/1000).toFixed(1)+"k cr target")+
       kpi("₹"+(SUM.prod/100000).toFixed(2)+"L cr","PROJECTED OUTPUT","117% of ₹"+(SUM.prodT/100000).toFixed(2)+"L cr target")+
       kpi(SUM.jobs.toLocaleString("en-IN"),"DIRECT JOBS","+2.5 lakh indirect · 82% of target")+
     '</div>'+
     '<div class="sub2">Investment by tranche · bar = share of ₹69,548 cr cumulative</div>'+tbars+
     '<div class="leg" style="margin:16px 0 2px"><span><i class="sw" style="background:var(--cyan)"></i>Bare components</span>'+
       '<span><i class="sw" style="background:var(--mag)"></i>Sub-assemblies</span>'+
       '<span><i class="sw" style="background:var(--yel)"></i>Materials &amp; supply chain</span>'+
       '<span><i class="sw" style="background:var(--cap)"></i>Capital goods</span></div>'+
     '<div class="sub2">106 projects by value-chain layer</div>'+layer+
     '<div class="sub2">Projects by sector — all five tranches</div>'+(function(){var MX=Math.max.apply(null,SECTORS.map(function(s){return s.n;}));var rows=SECTORS.map(function(s){return '<div class="secrow"><div class="scn"><i class="sw" style="background:'+COL[s.c]+'"></i><span>'+s.p+'</span></div><div class="scb"><i style="width:'+(s.n/MX*100).toFixed(1)+'%;background:'+COL[s.c]+'"></i></div><div class="scv">'+s.n+'</div></div>';}).join('');rows+='<div class="secrow"><div class="scn"><i class="sw" style="background:#3a3a3a"></i><span>Other single-project segments ('+SECOTHER.k+')</span></div><div class="scb"><i style="width:'+(SECOTHER.n/MX*100).toFixed(1)+'%;background:#3a3a3a"></i></div><div class="scv">'+SECOTHER.n+'</div></div>';return rows;})()+'<div class="sub2" style="margin:14px 0 0;color:#8a8a8a;font-weight:400">106 projects across 15 states (Oct 2025 – Aug 2026). Per-state project counts are not published for every tranche, so no state breakdown is shown.</div>'+
     '<div class="sub2">Implementation status of the 106 approved projects</div>'+impl+
     '<div class="sub2">Share of domestic demand ECMS capacity is designed to meet</div>'+demand+
     '<div class="sub2" style="margin:8px 0 0;color:#8a8a8a;font-weight:400">Coverage figures are stated aims as capacity comes online (2–3 yr horizon), latest per component across tranche releases. "meets + exports" = full domestic demand with surplus.</div>'+
     '<div class="src"><span>five tranches · Oct 2025 – Aug 2026 · source: PIB releases 2183028 / 2190872 / 2210864 / 2247040 / 2300625</span><span class="brand">@indiaemerges</span></div>'+
   '</div></div>';
}

document.getElementById("units").innerHTML=summaryCard()+geographyCard()+T.map(trancheCard).join("");

document.querySelectorAll('input[data-c]').forEach(function(sl){
  sl.addEventListener("input",function(){document.getElementById(sl.dataset.c).style.fontSize=sl.value+"px";});
});
document.querySelectorAll('button[data-png]').forEach(function(b){
  b.addEventListener("click",function(){
    html2canvas(document.getElementById(b.dataset.png),{backgroundColor:"#000",scale:2,useCORS:true}).then(function(cv){
      var a=document.createElement("a");a.download="ecms_"+b.dataset.n+"_indiaemerges.png";a.href=cv.toDataURL("image/png");a.click();});
  });
});
</script></body></html>
